<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sam Safaris</title>
<style>
html,body{margin:0;height:100%;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#0b4ea2,#4aa3ff);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;color:#fff}
#loading{width:min(92%,720px);background:rgba(255,255,255,.14);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:24px;padding:36px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.logo{font-size:72px}.title{font-size:52px;font-weight:800;letter-spacing:2px;color:#fff}.sub{color:#dff1ff}
#status{margin:20px 0;font-size:22px;font-weight:600;color:#fff}
.bar{height:12px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden}
.fill{height:100%;width:35%;background:linear-gradient(90deg,#fff,#bde3ff,#fff);animation:move 2s infinite}
@keyframes move{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
.road{height:60px;position:relative;margin-top:26px}
.jeep{position:absolute;font-size:42px;animation:drive 6s linear infinite}
@keyframes drive{0%{left:-10%}100%{left:100%}}
.fact{margin-top:18px;color:#eef8ff}
.fade{opacity:0;transition:.8s}
</style></head><body>
<div id="loading">
<div class="logo">🌍</div>
     <img src="assets/logo.jpeg" alt="Sam Safaris Logo" class="logo">
<div class="title">SAM SAFARIS</div>
      
<div class="sub">Explore East Africa in Comfort</div>
<div id="status">💙 Planning your next unforgettable journey...</div>
<div class="bar"><div class="fill"></div></div>
<div class="road"><div class="jeep">🚙</div></div>
<div id="fact" class="fact"></div>
<p class="sub">🇰🇪 Kenya • 🇹🇿 Tanzania • 🇺🇬 Uganda • 🇷🇼 Rwanda</p>
</div>
<script>
const msgs=["✈️ Finding the best safari routes...","🏝️ Discovering hidden destinations...","🦒 Connecting you with amazing experiences...","📍 Preparing your East African adventure...","💙 Almost ready..."];
const facts=["Luxury tours across East Africa.","Trusted local guides and unforgettable experiences.","From wildlife safaris to beach holidays.","Adventure starts with Sam Safaris."];
let i=0,j=0;
setInterval(()=>status.textContent=msgs[i++%msgs.length],1800);
setInterval(()=>fact.textContent=facts[j++%facts.length],3000);
window.addEventListener("flutter-first-frame",()=>{loading.classList.add("fade");setTimeout(()=>loading.remove(),800);});
</script>
<script src="flutter_bootstrap.js" async></script>
</body></html>
