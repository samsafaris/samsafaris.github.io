
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sam Safaris</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;overflow:hidden}
body{
background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.6)),url("assets/safari.webp") center/cover no-repeat fixed;
display:flex;align-items:center;justify-content:center;color:#fff}
#loading{width:min(90%,700px);text-align:center;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);padding:30px;border-radius:20px;border:1px solid rgba(255,255,255,.2)}
h1{font-size:54px;margin:10px 0;color:#ffcc33}
h2{margin:0;font-weight:300}
#status{height:28px;margin:18px 0;font-size:20px}
.bar{height:10px;background:#555;border-radius:20px;overflow:hidden}
.fill{height:100%;width:10%;background:#ffb300;animation:load 2s infinite}
@keyframes load{0%{margin-left:-30%;width:30%}100%{margin-left:100%;width:40%}}
.road{margin-top:30px;height:60px;position:relative;border-top:3px dashed #ddd}
.jeep{position:absolute;font-size:42px;animation:drive 6s linear infinite}
@keyframes drive{0%{left:-10%}100%{left:100%}}
.fade{opacity:0;transition:opacity .8s}
.small{opacity:.85;margin-top:18px}
</style>
</head>
<body>
<div id="loading">
<div style="font-size:70px">🦁</div>
<h1>SAM SAFARIS</h1>
<h2>Explore East Africa</h2>
<div id="status">🌍 Preparing your East African adventure...</div>
<div class="bar"><div class="fill"></div></div>
<div class="road"><div class="jeep">🚙</div></div>
<p id="fact" class="small"></p>
<p class="small">🇰🇪 Kenya • 🇹🇿 Tanzania • 🇺🇬 Uganda • 🇷🇼 Rwanda</p>
</div>
<script>
const msgs=[
"🦁 Spotting the Big Five...",
"🐘 Guiding elephants to your screen...",
"🦒 Crossing the savannah...",
"🦓 Tracking unforgettable safaris...",
"🌄 Preparing your East African adventure...",
"🚙 Almost ready..."
];
const facts=[
"Did you know? Kenya hosts the Great Migration.",
"Adventure starts with trusted local guides.",
"Discover national parks, beaches and mountains.",
"Thank you for choosing Sam Safaris."
];
let i=0,j=0;
setInterval(()=>{status.textContent=msgs[i++%msgs.length]},1800);
setInterval(()=>{fact.textContent=facts[j++%facts.length]},3500);
window.addEventListener("flutter-first-frame",()=>{
 loading.classList.add("fade");
 setTimeout(()=>loading.remove(),800);
});
</script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
